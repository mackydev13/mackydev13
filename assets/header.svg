<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="MACKY DEV — Full-Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060C"/>
      <stop offset="0.55" stop-color="#081019"/>
      <stop offset="1" stop-color="#0B1526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1526"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0B1526"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7DD3FC" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#22D3EE" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#22D3EE" flood-opacity="0.35"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      .scan { animation: scanmove 9s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      @keyframes scanmove { 0% { transform: translateY(-80px); } 100% { transform: translateY(440px); } }
    </style>
  </defs>

  <rect width="1000" height="360" fill="url(#bgGrad)"/>
  <rect width="1000" height="360" fill="url(#glow)"/>
  <rect width="1000" height="360" fill="url(#grid)"/>
  <rect class="scan" x="0" y="-80" width="1000" height="70" fill="url(#scanGrad)"/>

  <rect x="14" y="14" width="972" height="332" rx="10" fill="none" stroke="#14283C" stroke-width="1.5"/>
  <g fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.65">
    <path d="M24 32 V22 Q24 16 30 16 H40"/>
    <path d="M976 32 V22 Q976 16 970 16 H960"/>
    <path d="M24 328 V338 Q24 344 30 344 H40"/>
    <path d="M976 328 V338 Q976 344 970 344 H960"/>
  </g>

  <g class="mono">
    <circle class="pulse" cx="44" cy="46" r="4" fill="#22D3EE"/>
    <text x="60" y="51" font-size="13" letter-spacing="3" fill="#22D3EE">SYSTEM // ONLINE</text>
    <text x="944" y="51" text-anchor="end" font-size="13" letter-spacing="2" fill="#475569">@mackydev13</text>

    <text x="46" y="150" font-size="56" font-weight="700" letter-spacing="8" fill="#E6EDF7" filter="url(#glowF)">MACKY DEV</text>
    <rect x="50" y="168" width="330" height="2.5" rx="1.25" fill="url(#ruleGrad)" filter="url(#glowF)"/>

    <text x="46" y="198" font-size="17" letter-spacing="4" fill="#7DD3FC">FULL-STACK DEVELOPER · SOFTWARE ENGINEER</text>

    <text x="46" y="234" font-size="16" fill="#94A3B8">I build full-stack systems — from database schema,</text>
    <text x="62" y="256" font-size="16" fill="#94A3B8">to deployed interface.</text>
  </g>

  <g class="mono">
    <rect x="46" y="298" width="212" height="34" rx="6" fill="#0B1526" stroke="#1C3A55"/>
    <rect x="276" y="298" width="310" height="34" rx="6" fill="#0B1526" stroke="#1C3A55"/>
    <rect x="604" y="298" width="240" height="34" rx="6" fill="#0B1526" stroke="#1C3A55"/>
    <text x="62" y="320" font-size="14" letter-spacing="1.5" fill="#C7D2E0">
      <tspan fill="#22D3EE">STATUS▸</tspan><tspan> ONLINE</tspan>
    </text>
    <text x="292" y="320" font-size="14" letter-spacing="1.5" fill="#C7D2E0">
      <tspan fill="#22D3EE">LOCATION▸</tspan><tspan> DAVAO CITY, PH</tspan>
    </text>
    <text x="620" y="320" font-size="14" letter-spacing="1.5" fill="#C7D2E0">
      <tspan fill="#22D3EE">FOCUS▸</tspan><tspan> WEB · CLOUD · OPS</tspan>
    </text>
  </g>
</svg>